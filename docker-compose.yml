services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [finance-net]
    # kein "ports:" - nur das Backend darf ihn erreichen

  backend:
    build: ./backend
    env_file: .env
    environment:
      - Ollama__BaseUrl=http://ollama:11434/
    volumes:
      - backend_data:/app/data
      - ./backend/keys:/app/keys:ro
      - ./backend/category-rules.json:/app/category-rules.json:ro
    depends_on: [ollama]
    networks: [finance-net]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [finance-net]

networks:
  finance-net:

volumes:
  ollama_models:
  backend_data:
