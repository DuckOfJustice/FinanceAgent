services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      # nur fuer lokale Frontend-Entwicklung (npm run dev / vite proxy) direkt erreichbar,
      # im normalen Betrieb laeuft alles ueber die nginx-Proxy-Route des frontend-Containers.
      - "8081:8080"
    volumes:
      - backend_data:/app/data
      - ./backend/keys:/app/keys:ro
      - ./backend/category-rules.json:/app/category-rules.json:ro
    networks: [finance-net]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [finance-net]

networks:
  finance-net:

volumes:
  backend_data:
