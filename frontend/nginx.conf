server {
    # Nur HTTPS->HTTP-Weiterleitung: das Auth-Cookie ist Secure (siehe Auth.cs), Browser
    # verwerfen es also stillschweigend auf reinem HTTP - ausser bei localhost, das Browser
    # dafuer ausnehmen (deshalb ist das im lokalen Dev-Loopback nie aufgefallen). Port 8080
    # bleibt fuer lokale Dev-Bequemlichkeit bestehen, leitet aber jetzt auf 8443 weiter.
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        # Neukategorisierung/Refresh rufen pro Buchung das lokale LLM auf und
        # koennen bei vielen Buchungen laenger als die 60s-Default dauern.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # nginx-Default (1m) reicht nicht fuer CAMT.053-Exporte mit vielen Buchungen -
        # ohne das hier scheitert der Upload mit 413, bevor er das Backend erreicht.
        client_max_body_size 50m;
    }

    location / {
        try_files $uri /index.html;
    }
}
